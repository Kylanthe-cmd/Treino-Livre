<body>
<div id="app"><div class="empty" style="margin:40px">Carregando seus treinos…</div></div>
<div class="toast-box" id="toastBox" aria-live="polite"></div>
<dialog id="modal" class="dialog" aria-labelledby="modal-title"></dialog>
<script>
'use strict';
/* Treino Livre: aplicativo offline em arquivo único. Todos os dados e mídias
   ficam no IndexedDB deste navegador; não há servidor nem conexão externa. */
const DB_NAME='treinolivre-web-v1',DB_VERSION=1;
const ICONS={home:'<path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22v-9h6v9"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 6-7"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6M10 10v7m4-7v7"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',arrow:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',play:'<path d="m8 5 12 7-12 7Z"/>',check:'<path d="m5 12 5 5L20 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',dumbbell:'<path d="m6.5 6.5 11 11m-14-9 5-5m-5 5-2 2 5 5 2-2m7 7 5-5m-5 5 2 2 5-5-2-2"/>',grip:'<path d="M8 5v14M12 5v14M16 5v14"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',video:'<rect x="2" y="4" width="15" height="16" rx="2"/><path d="m17 10 5-3v10l-5-3"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-4 4 4-4 4 4M4 7V3h16v4"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',minus:'<path d="M5 12h14"/>',pause:'<path d="M9 5v14m6-14v14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7Z"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const I=(name,size)=>`<svg aria-hidden="true" width="${size||20}" height="${size||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">${ICONS[name]||ICONS.dumbbell}</svg>`;
const COLORS=['#c6f572','#78c9fa','#bc9cff','#ffb477','#f88baa','#7cdbcf','#e8ca74'];
const EMOJIS=['💪','🔥','🏋️','🦵','⚡','🎯','🧘','🚴','🏃','🛡️'];
let db, state={workouts:[],exercises:[],sets:[],sessions:[],active:null,route:'/',editing:null,modalSubmit:null,zoom:1,chartName:'',wakeLock:null,restNotified:false};
const blobUrls=new Map();
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseKg=s=>{const value=String(s??'').trim().replace(',','.');if(!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(value))return NaN;const n=Number(value);return Number.isFinite(n)&&n>=0&&n<=10000?n:NaN};
const fmtKg=n=>{const v=Number(typeof n==='string'?n.replace(',','.'):n);return Number.isFinite(v)?v.toLocaleString('pt-BR',{maximumFractionDigits:2}):String(n??'')};
const fmtTime=seconds=>{const s=Math.max(0,Math.floor(seconds));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map((v,i)=>i===0?String(v):String(v).padStart(2,'0')).join(':')};
const fmtShort=seconds=>{const n=Math.max(0,Math.floor(seconds)),m=Math.floor(n/60);return m>=60?`${Math.floor(m/60)}h ${m%60}min`:`${m}min ${n%60}s`};
const fmtDate=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const niceInt=(v,min,max)=>{const n=Number(String(v).trim());return Number.isInteger(n)&&n>=min&&n<=max?n:NaN};
const isCardio=e=>e?.kind==='cardio';
const fmtDec=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2});
const parseMetric=(value,max,required=false)=>{const text=String(value??'').trim().replace(',','.');if(!text)return required?NaN:null;if(!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(text))return NaN;const number=Number(text);return Number.isFinite(number)&&number>=0&&number<=max?number:NaN};
const cardioSummary=c=>{const v=c||{},parts=[];if(Number.isFinite(Number(v.durationMinutes))&&v.durationMinutes!==null&&v.durationMinutes!=='')parts.push(`${fmtDec(v.durationMinutes)} min`);if(v.inclinePct!==null&&v.inclinePct!==undefined&&v.inclinePct!=='')parts.push(`Inclinação ${fmtDec(v.inclinePct)}%`);if(v.speedKmh!==null&&v.speedKmh!==undefined&&v.speedKmh!=='')parts.push(`${fmtDec(v.speedKmh)} km/h`);if(v.distanceKm!==null&&v.distanceKm!==undefined&&v.distanceKm!=='')parts.push(`${fmtDec(v.distanceKm)} km`);return parts.join(' · ')||'Cardio'};
const unitsForExercise=e=>isCardio(e)?1:(e.sets?.length??setsFor(e.id).length);
const completedUnits=e=>isCardio(e)?Number(!!e.completed):(e.sets||[]).filter(x=>x.completed).length;
function toast(message,error=false){let el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;document.getElementById('toastBox').append(el);setTimeout(()=>el.remove(),4200)}
function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function done(tx){return new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Operação cancelada'))})}
function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;const w=d.createObjectStore('workouts',{keyPath:'id'});w.createIndex('createdAt','createdAt');const e=d.createObjectStore('exercises',{keyPath:'id'});e.createIndex('workoutId','workoutId');const s=d.createObjectStore('sets',{keyPath:'id'});s.createIndex('exerciseId','exerciseId');d.createObjectStore('sessions',{keyPath:'id'});d.createObjectStore('media',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function all(store){return request(db.transaction(store).objectStore(store).getAll())}
async function get(store,id){return request(db.transaction(store).objectStore(store).get(id))}
async function put(store,record){const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(record);await done(tx)}
async function del(store,id){const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);await done(tx)}
async function refresh(){const [w,e,s,h,a]=await Promise.all([all('workouts'),all('exercises'),all('sets'),all('sessions'),get('meta','active')]);state.workouts=w.sort((a,b)=>b.createdAt-a.createdAt);state.exercises=e;state.sets=s;state.sessions=h.sort((a,b)=>b.finishedAt-a.finishedAt);state.active=a?.value||null;render()}
const exFor=id=>state.exercises.filter(e=>e.workoutId===id).sort((a,b)=>a.orderIndex-b.orderIndex);
const setsFor=id=>state.sets.filter(s=>s.exerciseId===id).sort((a,b)=>a.setNumber-b.setNumber);
const workout=id=>state.workouts.find(w=>w.id===id);
function go(path){if(location.hash==='#'+path){state.route=path;render()}else location.hash=path}
function route(){let p=decodeURI(location.hash.replace(/^#/,''))||'/';state.route=p;render()}
function navItem(path,label,icon,active){return `<button type="button" class="nav-item ${active?'active':''}" data-action="navigate" data-path="${path}">${I(icon)}<span>${label}</span></button>`}
function shell(content,title,active,hasFab){const nav=[navItem('/','Meus treinos','home',active==='home'),navItem('/history','Histórico','history',active==='history'),navItem('/evolution','Evolução','chart',active==='evolution')].join('');const action=hasFab==='workout'?'new-workout':hasFab==='exercise'?'new-exercise':null;return `<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">${I('dumbbell')}</span><span>TREINO<span style="color:var(--accent)">LIVRE</span></span></div><span class="tag">Meu espaço</span><nav class="nav" aria-label="Menu principal">${nav}</nav><div class="side-footer"><b>${I('lock')} Privado por natureza</b><p>Seus treinos ficam neste navegador, mesmo sem internet.</p><button class="btn btn-secondary btn-small" data-action="backup-export">${I('download')} Exportar backup</button></div></aside><div class="shell"><header class="topbar"><div class="crumb">${I('dumbbell')} <span>Treino Livre</span><span style="opacity:.5">/</span><strong>${esc(title)}</strong></div><div class="top-actions"><button class="btn btn-icon btn-ghost" aria-label="Backup de dados" title="Backup de dados" data-action="backup-panel">${I('download')}</button>${state.active?`<button class="btn btn-secondary btn-small" data-action="navigate" data-path="/run">${I('play')} Em andamento</button>`:`<span class="live-label"><span class="live-dot"></span> Offline</span>`}</div></header><main class="main" id="page">${content}<p class="footer-note">Treino Livre · Seus dados ficam apenas neste navegador · Faça backups periodicamente</p></main></div><nav class="mobile-nav" aria-label="Menu inferior">${nav}</nav>${action?`<button aria-label="Adicionar" class="fab" data-action="${action}">${I('plus')}</button>`:''}</div>`}
function heading(kicker,title,desc,button){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${button||''}</div>`}
function empty(icon,title,desc,button){return `<div class="empty"><div class="empty-mark">${icon}</div><h3>${title}</h3><p>${desc}</p>${button||''}</div>`}
function render(){if(!db)return;const p=state.route;let content,sect,title,hasFab=null;
 if(p==='/'||p==='/workouts'){title='Meus treinos';sect='home';hasFab='workout';content=homePage()}
 else if(p.startsWith('/workout/')){const id=p.slice('/workout/'.length);title=workout(id)?.name||'Treino';sect='home';hasFab='exercise';content=workoutPage(id)}
 else if(p==='/run'){title='Treino em andamento';sect='home';content=runPage()}
 else if(p==='/history'){title='Histórico';sect='history';content=historyPage()}
 else if(p.startsWith('/history/')){title='Detalhes da sessão';sect='history';content=historyDetail(p.slice('/history/'.length))}
 else if(p==='/evolution'){title='Evolução';sect='evolution';content=evolutionPage()}
 else {title='Meus treinos';sect='home';content=homePage()}
 document.getElementById('app').innerHTML=shell(content,title,sect,hasFab);hydrateMedia();updateClocks();if(p==='/run'&&state.active)tryWakeLock();else releaseWakeLock();}
function homePage(){const completed=state.sessions.length,done=state.sessions.reduce((n,s)=>n+s.completedCount,0);const banner=state.active?`<div class="hero"><div class="hero-content"><div class="eyebrow">${I('bolt')} Continue de onde parou</div><h2>${esc(state.active.workoutName)}</h2><p>Seu treino em andamento foi salvo automaticamente.</p><button class="btn" style="margin-top:17px" data-action="navigate" data-path="/run">${I('play')} Retomar treino</button></div><div class="hero-illustration">💪</div></div>`:`<div class="hero"><div class="hero-content"><div class="eyebrow">${I('bolt')} Seu ritmo. Sua evolução.</div><h2>O próximo treino começa aqui.</h2><p>Planeje suas séries, registre cargas e acompanhe cada conquista.</p><button class="btn" style="margin-top:17px" data-action="new-workout">${I('plus')} Criar novo treino</button></div><div class="hero-illustration">🏋️</div></div>`;
 const cards=state.workouts.map(w=>`<article class="workout-card" style="--color:${COLORS.includes(w.color)?w.color:COLORS[0]}"><div class="card-body" data-action="navigate" data-path="/workout/${w.id}" role="button" tabindex="0" aria-label="Abrir ${esc(w.name)}"><div class="card-icon">${esc(w.icon||'💪')}</div><h3>${esc(w.name)}</h3><p>${esc(w.description||'Seu plano de treino personalizado')}</p></div><div class="card-foot"><span class="badge">${I('dumbbell')} ${exFor(w.id).length} exercício(s)</span><div class="card-menu"><button class="btn btn-icon btn-ghost" aria-label="Editar treino" title="Editar" data-action="edit-workout" data-id="${w.id}">${I('edit')}</button><button class="btn btn-icon btn-ghost" aria-label="Duplicar treino" title="Duplicar" data-action="duplicate-workout" data-id="${w.id}">${I('copy')}</button><button class="btn btn-icon btn-ghost" aria-label="Excluir treino" title="Excluir" data-action="delete-workout" data-id="${w.id}">${I('trash')}</button></div></div></article>`).join('');
 return `${heading('Visão geral','Meus treinos','Organize, execute e acompanhe seus treinos em um só lugar.',`<button class="btn btn-primary" data-action="new-workout">${I('plus')} Novo treino</button>`)}${banner}<div class="stats"><div class="stat"><span class="label">${I('dumbbell')} Treinos criados</span><b>${state.workouts.length}</b><small>Planos cadastrados</small></div><div class="stat"><span class="label">${I('history')} Sessões realizadas</span><b>${completed}</b><small>No histórico</small></div><div class="stat"><span class="label">${I('check')} Etapas concluídas</span><b>${done}</b><small>Em todas as sessões</small></div></div><div class="section-head"><h2>Seus planos</h2><span>${state.workouts.length} treino(s)</span></div>${cards?`<section class="cards">${cards}</section>`:empty('🏋️','Nenhum treino ainda','Toque no botão para criar seu primeiro treino e montar sua rotina.',`<button class="btn btn-primary" data-action="new-workout">${I('plus')} Criar treino</button>`)}`}
function thumb(e){return `<button class="exercise-thumb" aria-label="${e.mediaId?'Abrir mídia':'Exercício sem mídia'}" ${e.mediaId?`data-action="view-media" data-id="${e.mediaId}" data-type="${e.mediaType}"`: 'disabled'}>${e.mediaId?e.mediaType==='video'?`<video muted playsinline preload="metadata" data-media="${e.mediaId}"></video><span class="play-overlay">${I('play')}</span>`:`<img alt="Miniatura" data-media="${e.mediaId}">`:isCardio(e)?'🏃':'🏋️'}</button>`}
function workoutPage(id){
  const w=workout(id);
  if(!w)return empty('🤔','Treino não encontrado','Ele pode ter sido excluído.',`<button class="btn btn-secondary" data-action="navigate" data-path="/">Voltar</button>`);
  const exercises=exFor(id),strengthSets=exercises.filter(e=>!isCardio(e)).reduce((n,e)=>n+setsFor(e.id).length,0),cardioCount=exercises.filter(isCardio).length,total=strengthSets+cardioCount;
  const cards=exercises.map((e,i)=>`<article class="exercise-item" data-exercise="${e.id}" draggable="true"><div class="drag-handle" title="Arraste para reordenar" aria-label="Arrastar exercício" data-drag="${e.id}">${I('grip')}</div>${thumb(e)}<div class="exercise-copy"><h3>${i+1}. ${esc(e.name)} ${isCardio(e)?'<span class="kind-pill">Cardio</span>':''}</h3><p>${isCardio(e)?esc(cardioSummary(e.cardio)):`${setsFor(e.id).length} série(s) · ${e.restSeconds?`${e.restSeconds}s de descanso`:'Sem descanso definido'}`}</p>${e.notes?`<p class="note">${esc(e.notes)}</p>`:''}</div><div class="exercise-actions"><div class="mobile-sort"><button class="btn btn-icon btn-ghost" title="Mover para cima" aria-label="Mover para cima" data-action="move-exercise" data-id="${e.id}" data-dir="-1" ${i===0?'disabled':''}>${I('up')}</button><button class="btn btn-icon btn-ghost" title="Mover para baixo" aria-label="Mover para baixo" data-action="move-exercise" data-id="${e.id}" data-dir="1" ${i===exercises.length-1?'disabled':''}>${I('down')}</button></div><button class="btn btn-icon btn-ghost" title="Editar exercício" aria-label="Editar exercício" data-action="edit-exercise" data-id="${e.id}">${I('edit')}</button><button class="btn btn-icon btn-ghost hide-small" title="Remover exercício" aria-label="Remover exercício" data-action="delete-exercise" data-id="${e.id}">${I('trash')}</button></div></article>`).join('');
  const stats=`${exercises.length} exercícios · ${strengthSets} séries${cardioCount?` · ${cardioCount} cardio`:''}`;
  return `${heading('Meu planejamento',w.name,w.description||'Ajuste exercícios, séries e cardio antes de começar.',`<button class="btn btn-primary" data-action="start-workout" data-id="${w.id}" ${total===0?'disabled':''}>${I('play')} Iniciar treino</button>`)}<div class="workout-banner"><div><strong>${stats}</strong><p>Arraste os exercícios para mudar a ordem ou use as setas no celular.</p></div><div class="row wrap"><button class="btn btn-secondary btn-small" data-action="edit-workout" data-id="${id}">${I('edit')} Editar treino</button><button class="btn btn-primary" data-action="start-workout" data-id="${id}" ${total===0?'disabled':''}>${I('play')} Iniciar treino</button></div></div><div class="section-head"><h2>Exercícios</h2><button class="btn btn-secondary btn-small" data-action="new-exercise">${I('plus')} Adicionar exercício</button></div>${cards?`<section class="exercise-list" id="exerciseList">${cards}</section>`:empty('💪','Sem exercícios por enquanto','Adicione musculação ou cardio ao seu planejamento.',`<button class="btn btn-primary" data-action="new-exercise">${I('plus')} Adicionar exercício</button>`)}`;
}
function runPage(){
  const a=state.active;
  if(!a)return `${heading('Em andamento','Nenhum treino ativo','Escolha um treino para começar.')}${empty('⏱️','Você ainda não iniciou um treino','Abra um treino e toque em Iniciar treino.',`<button class="btn btn-primary" data-action="navigate" data-path="/">Ver treinos</button>`)}`;
  const total=a.exercises.reduce((n,e)=>n+unitsForExercise(e),0),doneCount=a.exercises.reduce((n,e)=>n+completedUnits(e),0);
  const remainingRest=a.restUntil?Math.max(0,Math.ceil((a.restUntil-Date.now())/1000)):0;
  const restOwner=a.restExerciseId||a.exercises.find(e=>!isCardio(e)&&e.sets.some(s=>!s.completed))?.id||a.exercises.find(e=>!isCardio(e))?.id;
  const exercises=a.exercises.map((e,ei)=>{
    const cardio=isCardio(e),complete=cardio?!!e.completed:e.sets.every(s=>s.completed);
    const restBlock=!cardio&&remainingRest>0&&restOwner===e.id?`<div class="rest-box rest-inline" id="restBox"><div><div class="eyebrow" style="color:var(--accent);margin:0">${I('clock')} Descanso de ${esc(e.name)}</div><b id="restClock">${fmtTime(remainingRest)}</b><div class="fine muted">Aviso sonoro e vibração ao terminar, se disponíveis.</div></div><button class="btn btn-secondary" data-action="skip-rest">Pular descanso</button></div>`:'';
    const content=cardio?`<div class="cardio-run"><div class="cardio-run-grid">${cardioInput('durationMinutes','Duração (min)',e.cardio?.durationMinutes,ei,'Ex.: 30')}${cardioInput('inclinePct','Inclinação (%)',e.cardio?.inclinePct,ei,'Ex.: 5')}${cardioInput('speedKmh','Velocidade (km/h)',e.cardio?.speedKmh,ei,'Ex.: 6')}${cardioInput('distanceKm','Distância (km)',e.cardio?.distanceKm,ei,'Ex.: 3')}</div><button class="btn ${complete?'btn-secondary':'btn-primary'} cardio-finish" data-action="toggle-cardio" data-ei="${ei}">${I('check')} ${complete?'Desmarcar cardio':'Marcar cardio como concluído'}</button></div>`:
      `<div class="set-header"><span>Série</span><span>Reps</span><span>Carga (kg)</span><span style="text-align:center">Feita</span></div>${e.sets.map((s,si)=>`<div class="set-row ${s.completed?'done':''}"><div class="set-index">${si+1}</div><input type="text" inputmode="numeric" aria-label="Repetições da série ${si+1}" value="${s.reps}" data-run-field="reps" data-ei="${ei}" data-si="${si}"><input type="text" inputmode="decimal" aria-label="Carga da série ${si+1}" value="${fmtKg(s.weightKg)}" data-run-field="weightKg" data-ei="${ei}" data-si="${si}"><input class="set-check" type="checkbox" aria-label="Concluir série ${si+1} de ${esc(e.name)}" data-run-check data-ei="${ei}" data-si="${si}" ${s.completed?'checked':''}></div>`).join('')}`;
    return `<article class="run-ex ${complete?'finished':''} ${restBlock?'rest-active':''}"><div class="run-ex-head">${thumb(e)}<div style="flex:1;min-width:0"><h3>${esc(e.name)} ${cardio?'<span class="kind-pill">Cardio</span>':''}</h3><p>${cardio?esc(cardioSummary(e.cardio)):`${e.sets.length} séries · ${e.restSeconds?e.restSeconds+'s descanso':'Sem descanso'}`}${e.notes?' · '+esc(e.notes):''}</p></div>${complete?`<span class="pill">${I('check')} Finalizado</span>`:''}</div>${restBlock}${content}</article>`;
  }).join('');
  return `${heading('Hora de treinar',a.workoutName,'Marque as séries ou o cardio como concluídos. O progresso é salvo automaticamente.')}<div class="run-top"><div class="row space wrap"><div><div class="fine muted">DURAÇÃO DO TREINO</div><div class="run-time" id="workoutClock">${fmtTime((Date.now()-a.startedAt)/1000)}</div></div><div style="text-align:right"><span class="pill">${doneCount} / ${total} etapas</span><p class="fine muted" style="margin-bottom:0">${Math.round(100*doneCount/Math.max(1,total))}% concluído</p></div></div><div class="progress-bar" style="margin-top:17px"><div style="width:${100*doneCount/Math.max(1,total)}%"></div></div></div>${exercises}<div class="run-footer"><button class="btn btn-danger" data-action="discard-run">${I('trash')} Descartar</button><button class="btn btn-primary" data-action="finish-run">${I('check')} Finalizar treino</button></div>`;
}
function cardioInput(field,label,value,ei,placeholder){return `<label class="cardio-field"><span>${label}</span><input type="text" inputmode="decimal" placeholder="${placeholder}" aria-label="${label}" value="${value===null||value===undefined?'':esc(fmtDec(value))}" data-run-cardio="${field}" data-ei="${ei}"></label>`;}

function evolutionPage(){const data=new Map();for(const s of state.sessions){for(const e of s.exercises){const key=e.name.trim().toLocaleLowerCase('pt-BR');const weights=e.sets.filter(t=>t.completed).map(t=>t.weightKg);if(!weights.length)continue;if(!data.has(key))data.set(key,{name:e.name,values:[]});data.get(key).values.push({date:s.finishedAt,weight:Math.max(...weights)})}}const names=[...data.keys()].sort();if(!names.length)return `${heading('Acompanhe seu progresso','Evolução de carga','Visualize sua maior carga concluída em cada sessão.')}${empty('📈','Sua evolução aparecerá aqui','Conclua algumas séries durante seus treinos para gerar o gráfico.')}`;if(!data.has(state.chartName))state.chartName=names[0];const entry=data.get(state.chartName),values=entry.values.sort((a,b)=>a.date-b.date),max=Math.max(1,...values.map(x=>x.weight)),min=0;const W=720,H=280,margin={l:48,r:24,t:23,b:45};const x=i=>margin.l+(W-margin.l-margin.r)*(values.length===1?.5:i/(values.length-1));const y=v=>H-margin.b-(H-margin.t-margin.b)*(v-min)/(max-min);const poly=values.map((v,i)=>`${x(i)},${y(v.weight)}`).join(' ');const grids=[0,.25,.5,.75,1].map(f=>`<line class="chart-axis" x1="${margin.l}" x2="${W-margin.r}" y1="${y(max*f)}" y2="${y(max*f)}"/><text x="${margin.l-10}" y="${y(max*f)+4}" text-anchor="end">${fmtKg(max*f)}</text>`).join('');const pts=values.map((v,i)=>`<circle class="chart-point" cx="${x(i)}" cy="${y(v.weight)}" r="6"><title>${fmtDate(v.date)}: ${fmtKg(v.weight)} kg</title></circle>`).join('');const labels=values.filter((_,i)=>values.length<=8||i%Math.ceil(values.length/7)===0||i===values.length-1).map(v=>{const i=values.indexOf(v);return `<text x="${x(i)}" y="${H-16}" text-anchor="middle">${new Date(v.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>`}).join('');return `${heading('Acompanhe seu progresso','Evolução de carga','Maior carga por exercício em cada sessão concluída.') }<div class="section-head wrap"><h2>${esc(entry.name)}</h2><select cl async function toggleSet(ei,si,checked){const a=state.active;if(!a||!a.exercises[ei]?.sets[si])return;const e=a.exercises[ei],s=e.sets[si];s.completed=checked;if(checked){const remaining=a.exercises.reduce((n,e)=>n+unitsForExercise(e)-completedUnits(e),0);if(e.restSeconds&&remaining>0){a.restUntil=Date.now()+e.restSeconds*1000;a.restExerciseId=e.id;state.restNotified=false}else{a.restUntil=null;a.restExerciseId=null}}else if(a.restExerciseId===e.id){a.restUntil=null;a.restExerciseId=null}await saveActive();render()}
async function changeRunField(el){const a=state.active,ei=+el.dataset.ei,si=+el.dataset.si,s=a?.exercises[ei]?.sets[si];if(!s)return;const value=el.dataset.runField==='reps'?niceInt(el.value,1,999):parseKg(el.value);if(!Number.isFinite(value)){toast('Informe um valor numérico válido.',true);el.value=el.dataset.runField==='reps'?s.reps:fmtKg(s.weightKg);return}s[el.dataset.runField]=value;await saveActive()}
async function toggleCardio(ei){const a=state.active,e=a?.exercises[ei];if(!isCardio(e))return;e.completed=!e.completed;await saveActive();render();}
async function changeRunCardio(el){const a=state.active,e=a?.exercises[Number(el.dataset.ei)],field=el.dataset.runCardio;if(!isCardio(e)||!['durationMinutes','inclinePct','speedKmh','distanceKm'].includes(field))return;const value=field==='durationMinutes'?niceInt(el.value,1,1440):parseMetric(el.value,{inclinePct:40,speedKmh:60,distanceKm:1000}[field]);if(!Number.isFinite(value)&&value!==null){toast('Valor inválido para '+({durationMinutes:'duração',inclinePct:'inclinação',speedKmh:'velocidade',distanceKm:'distância'}[field])+'.',true);el.value=e.cardio?.[field]==null?'':fmtDec(e.cardio[field]);return;}e.cardio=e.cardio||{};e.cardio[field]=value;await saveActive();}
function restAlarm(){try{navigator.vibrate?.([250,150,250])}catch{}try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(AudioContext){const ctx=new AudioContext();ctx.resume().then(()=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=740;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.1,ctx.currentTime+.03);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.55);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.6);osc.onended=()=>ctx.close()}).catch(()=>{})}}catch{}}
async function skipRest(){if(!state.active)return;state.active.restUntil=null;state.active.restExerciseId=null;state.restNotified=true;await saveActive();render()}
async function finishRun(){const a=state.active;if(!a)return;const total=a.exercises.reduce((n,e)=>n+unitsForExercise(e),0),completed=a.exercises.reduce((n,e)=>n+completedUnits(e),0);if(!confirm(`Finalizar treino?\n${completed} de ${total} etapas concluídas. A sessão será salva no histórico.`))return;const now=Date.now();const record={id:a.id,workoutId:a.workoutId,workoutName:a.workoutName,startedAt:a.startedAt,finishedAt:now,durationSeconds:Math.max(0,Math.floor((now-a.startedAt)/1000)),completedCount:completed,totalCount:total,exercises:a.exercises.map(e=>isCardio(e)?({name:e.name,kind:'cardio',cardio:{...(e.cardio||{})},completed:!!e.completed,sets:[]}):({name:e.name,kind:'strength',sets:e.sets.map(s=>({setNumber:s.setNumber,reps:s.reps,weightKg:s.weightKg,completed:s.completed}))}))};const tx=db.transaction(['sessions','meta'],'readwrite');tx.objectStore('sessions').put(record);tx.objectStore('meta').delete('active');await done(tx);state.active=null;releaseWakeLock();await refresh();go('/history/'+record.id);toast('Treino salvo no histórico!')}
async function discardRun(){if(!state.active||!confirm('Descartar o treino em andamento? O progresso desta sessão será perdido.'))return;await del('meta','active');state.active=null;releaseWakeLock();go('/');toast('Sessão descartada.')}
async function tryWakeLock(){if(state.wakeLock||!navigator.wakeLock||document.visibilityState!=='visible')return;try{state.wakeLock=await navigator.wakeLock.request('screen');state.wakeLock.addEventListener('release',()=>{state.wakeLock=null})}catch{ /* Arquivo local ou navegador podem não conceder Wake Lock. */ }}
async function releaseWakeLock(){if(state.wakeLock){try{await state.wakeLock.release()}catch{}state.wakeLock=null}}
function updateClocks(){const a=state.active;if(!a)return;const c=document.getElementById('workoutClock');if(c)c.textContent=fmtTime((Date.now()-a.startedAt)/1000);const rest=document.getElementById('restClock');if(rest)rest.textContent=fmtTime(Math.max(0,Math.ceil((a.restUntil-Date.now())/1000)))}
async function tick(){updateClocks();if(state.active?.restUntil&&Date.now()>=state.active.restUntil&&!state.restNotified){state.restNotified=true;state.active.restUntil=null;state.active.restExerciseId=null;await saveActive();if(state.route==='/run'){restAlarm();toast('Descanso encerrado!');render()}}}
async function viewMedia(id,type){const url=await mediaUrl(id);if(!url)return toast('Não foi possível encontrar essa mídia.',true);state.zoom=1;modal(`${dialogHead('Mídia do exercício',type==='video'?'Vídeo de demonstração':'Imagem de demonstração')}<div class="dialog-body"><div class="viewer" id="viewer">${type==='video'?`<video src="${url}" controls playsinline style="max-width:100%"></video>`:`<img src="${url}" alt="Imagem ampliada" id="zoomImage">`}</div></div>${type==='image'?`<div class="viewer-toolbar"><button class="btn btn-secondary btn-small" data-action="zoom-out">${I('minus')} Reduzir</button><span class="badge" id="zoomLabel">100%</span><button class="btn btn-secondary btn-small" data-action="zoom-in">${I('plus')} Ampliar</button><button class="btn btn-secondary btn-small" data-action="media-fullscreen">Tela cheia</button></div>`:`<div class="viewer-toolbar"><button class="btn btn-secondary" data-action="media-fullscreen">Tela cheia</button></div>`}`,null,true)}
function zoomImage(delta){const img=document.getElementById('zoomImage');if(!img)return;state.zoom=Math.min(4,Math.max(1,state.zoom+delta));img.style.transform=`scale(${state.zoom})`;document.getElementById('zoomLabel').textContent=`${Math.round(state.zoom*100)}%`}
async function exportBackup(){try{const media=await all('media');const encoded=[];for(const m of media){const data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(fr.error);fr.readAsDataURL(m.blob)});encoded.push({...m,blob:data})}const backup={format:'TreinoLivreBackup',version:1,exportedAt:new Date().toISOString(),workouts:await all('workouts'),exercises:await all('exercises'),sets:await all('sets'),sessions:await all('sessions'),media:encoded,active:(await get('meta','active'))?.value||null};const file=new Blob([JSON.stringify(backup)],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='treinolivre-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup exportado com treinos, histórico e mídias.')}catch(err){console.error(err);toast('Não foi possível exportar o backup.',true)}}
async function importBackup(file){if(!file)return;let backup;try{backup=JSON.parse(await file.text());if(backup.format!=='TreinoLivreBackup'||backup.version!==1||!['workouts','exercises','sets','sessions','media'].every(k=>Array.isArray(backup[k])))throw Error('Formato inválido');if(!confirm('Importar este backup? Todos os dados atuais deste navegador serão substituídos.'))return;const blobs=await Promise.all(backup.media.map(async m=>{if(typeof m.blob!=='string'||!m.blob.startsWith('data:'))throw Error('Mídia inválida');const resp=await fetch(m.blob);return {...m,blob:await resp.blob()}}));const tx=db.transaction(['workouts','exercises','sets','sessions','media','meta'],'readwrite');for(const name of ['workouts','exercises','sets','sessions','media','meta'])tx.objectStore(name).clear();for(const name of ['workouts','exercises','sets','sessions'])for(const v of backup[name])tx.objectStore(name).put(v);for(const m of blobs)tx.objectStore('media').put(m);if(backup.active)tx.objectStore('meta').put({key:'active',value:backup.active});await done(tx);for(const url of blobUrls.values())URL.revokeObjectURL(url);blobUrls.clear();go('/');await refresh();toast('Backup importado com sucesso!')}catch(err){console.error(err);toast('Backup inválido ou sem espaço suficiente.',true)}}
// Ações de clique delegadas; a renderização nunca perde listeners.
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id;try{switch(action){case 'navigate':go(el.dataset.path);break;case 'new-workout':workoutEditor();break;case 'edit-workout':workoutEditor(id);break;case 'duplicate-workout':await duplicateWorkout(id);break;case 'delete-workout':await deleteWorkout(id);break;case 'new-exercise':exerciseEditor();break;case 'edit-exercise':exerciseEditor(id);break;case 'delete-exercise':await deleteExercise(id);break;case 'delete-from-editor':{const before=state.exercises.some(e=>e.id===id);await deleteExercise(id);if(before&&!state.exercises.some(e=>e.id===id))closeModal();break}case 'move-exercise':await moveExercise(id,+el.dataset.dir);break;case 'select-emoji':state.editing.icon=el.dataset.value;document.querySelectorAll('#emojiChoices .choice-btn').forEach(x=>x.classList.toggle('selected',x.dataset.value===state.editing.icon));break;case 'select-color':state.editing.color=el.dataset.value;document.querySelectorAll('#colorChoices .color-btn').forEach(x=>x.classList.toggle('selected',x.dataset.value===state.editing.color));break;case 'add-set':state.editing.rows.push({id:uid(),reps:12,weightKg:0,setNumber:state.editing.rows.length+1});updateEditorRows();break;case 'remove-set':if(state.editing.rows.length>1){state.editing.rows.splice(+el.dataset.index,1);updateEditorRows()}break;case 'apply-weight':{const w=parseKg(document.getElementById('allWeight').value);if(!Number.isFinite(w))return toast('Digite uma carga válida, como 12,5.',true);state.editing.rows.forEach(s=>s.weightKg=w);updateEditorRows();toast('Carga aplicada a todas as séries.');break}case 'pick-media':document.getElementById('mediaFile').click();break;case 'capture-photo':document.getElementById('cameraFile').click();break;case 'remove-media':{const d=state.editing;d.mediaFile=null;d.mediaId=null;d.removeMedia=true;const p=document.getElementById('editorMediaPreview');if(p.dataset.previewUrl)URL.revokeObjectURL(p.dataset.previewUrl);p.innerHTML='<span class="fine muted">Nenhuma mídia selecionada</span>';el.disabled=true;break}case 'start-workout':await startWorkout(id);break;case 'skip-rest':await skipRest();break;case 'toggle-cardio':await toggleCardio(+el.dataset.ei);break;case 'finish-run':await finishRun();break;case 'discard-run':await discardRun();break;case 'view-media':await viewMedia(id,el.dataset.type);break;case 'zoom-in':zoomImage(.25);break;case 'media-fullscreen':{const viewer=document.getElementById('viewer');if(viewer?.requestFullscreen)await viewer.requestFullscreen().catch(()=>toast('Tela cheia indisponível neste navegador.',true));break}case 'zoom-out':zoomImage(-.25);break;case 'close-modal':closeModal();break;case 'backup-panel':modal(`${dialogHead('Backup dos seus dados','Salve seus treinos e mídias em um arquivo para recuperar depois.')}<div class="dialog-body"><p class="muted fine">Os dados ficam neste navegador. Se você limpar os dados do navegador, mudar de navegador ou de pasta, poderá precisar restaurar um backup.</p><div class="row wrap"><button class="btn btn-primary" data-action="backup-export">${I('download')} Exportar backup</button><button class="btn btn-secondary" data-action="backup-import">${I('upload')} Importar backup</button></div><p class="fine muted" style="margin-top:20px">A importação substitui os dados existentes após sua confirmação.</p></div>`);break;case 'backup-export':await exportBackup();break;case 'backup-import':document.getElementById('backupFile')?.click();break}}catch(err){console.error(err);toast('Ocorreu um erro: '+(err.message||'tente novamente.'),true)}});
document.addEventListener('change',async event=>{const el=event.target;try{if(el.id==='mediaFile'||el.id==='cameraFile'){await changeMedia(el.files[0]);el.value=''}else if(el.id==='exKind'){document.getElementById('strengthFields').hidden=el.value==='cardio';document.getElementById('cardioFields').hidden=el.value!=='cardio';state.editing.kind=el.value;}else if(el.id==='chartSelect'){state.chartName=el.value;render()}else if(el.matches('[data-run-check]'))await toggleSet(+el.dataset.ei,+el.dataset.si,el.checked);else if(el.matches('[data-run-field]'))await changeRunField(el);else if(el.matches('[data-run-cardio]'))await changeRunCardio(el);else if(el.id==='backupFile'){await importBackup(el.files[0]);el.value=''}}catch(err){console.error(err);toast('Não foi possível atualizar o campo.',true)}});
document.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-draft-set]')&&state.editing?.type==='exercise'){const row=state.editing.rows[+el.dataset.index];if(row)row[el.dataset.draftSet]=el.value}});
document.getElementById('modal').addEventListener('submit',async event=>{event.preventDefault();if(!state.modalSubmit)return;const button=event.target.querySelector('[type=submit]');if(button)button.disabled=true;try{await state.modalSubmit()}catch(err){console.error(err);toast(err.message||'Não foi possível salvar.',true)}finally{if(button?.isConnected)button.disabled=false}});
document.getElementById('modal').addEventListener('close',()=>{const p=document.getElementById('editorMediaPreview');if(p?.dataset.previewUrl)URL.revokeObjectURL(p.dataset.previewUrl);state.modalSubmit=null;state.editing=null});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-action="navigate"][role="button"]')){ev.preventDefault();go(ev.target.dataset.path)}});
// Reordenação com mouse (HTML5 drag) e toque/caneta (Pointer Events).
let dragId=null;
document.addEventListener('dragstart',ev=>{const item=ev.target.closest?.('[data-exercise]');if(!item||!ev.target.closest('.exercise-list'))return;dragId=item.dataset.exercise;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragId);item.classList.add('dragging')});
document.addEventListener('dragover',ev=>{if(!dragId)return;const item=ev.target.closest?.('[data-exercise]');if(!item)return;ev.preventDefault();document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));item.classList.add('drop-target')});
document.addEventListener('drop',async ev=>{if(!dragId)return;ev.preventDefault();const target=ev.target.closest?.('[data-exercise]');const id=dragId;dragId=null;document.querySelectorAll('.drop-target,.dragging').forEach(n=>n.classList.remove('drop-target','dragging'));if(target&&target.dataset.exercise!==id){const item=state.exercises.find(e=>e.id===id),list=exFor(item.workoutId);const from=list.findIndex(e=>e.id===id),to=list.findIndex(e=>e.id===target.dataset.exercise);if(from>=0&&to>=0){list.splice(to,0,list.splice(from,1)[0]);await saveOrder(list)}}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drop-target,.dragging').forEach(n=>n.classList.remove('drop-target','dragging'))});
let pointerDrag=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const handle=e.target.closest?.('[data-drag]');if(!handle)return;pointerDrag={id:handle.dataset.drag,pointerId:e.pointerId,startY:e.clientY,y:e.clientY,active:false};handle.setPointerCapture?.(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!pointerDrag||pointerDrag.pointerId!==e.pointerId)return;pointerDrag.y=e.clientY;if(Math.abs(e.clientY-pointerDrag.startY)>8)pointerDrag.active=true;if(!pointerDrag.active)return;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));const item=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-exercise]');item?.classList.add('drop-target')});
document.addEventListener('pointerup',async e=>{if(!pointerDrag||pointerDrag.pointerId!==e.pointerId)return;const d=pointerDrag;pointerDrag=null;document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(!d.active)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-exercise]');if(target&&target.dataset.exercise!==d.id){const item=state.exercises.find(x=>x.id===d.id),list=exFor(item.workoutId),from=list.findIndex(x=>x.id===d.id),to=list.findIndex(x=>x.id===target.dataset.exercise);if(from>=0&&to>=0){list.splice(to,0,list.splice(from,1)[0]);await saveOrder(list)}}});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.active&&state.route==='/run')tryWakeLock()});
setInterval(()=>tick().catch(console.error),500);
(async()=>{try{if(!window.indexedDB)throw Error('IndexedDB indisponível');db=await openDb();await refresh();route()}catch(err){console.error(err);document.getElementById('app').innerHTML=`<div class="empty" style="margin:50px auto;max-width:600px"><span style="font-size:48px">⚠️</span><h3>Armazenamento local indisponível</h3><p>Abra o arquivo no Chrome, Edge ou Firefox, em uma janela normal (não anônima), e permita o armazenamento de dados. Detalhes: ${esc(err.message)}</p></div>`}})();
</script>

    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
